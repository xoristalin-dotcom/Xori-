services:
  - type: web
    name: telegramxor
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OFFLINE_MODE
        value: 'false'
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: KIE_API_KEY
        sync: false
      - key: KIE_BASE_URL
        value: https://api.kie.ai/v1
      - key: KIE_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: TELEGRAM_VOICE_URL
        sync: false
      - key: TELEGRAM_PHOTO_URL
        sync: false